<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoE文字游戏</title>
  <style>
/* ===== Reset & Base ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-panel: #1c2333;
  --bg-hover: #21262d;
  --border: #30363d;
  --border-light: #484f58;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-dim: #484f58;
  --life-red: #da3633;
  --life-red-dark: #8b1a1a;
  --mana-blue: #388bfd;
  --mana-blue-dark: #1a3a6b;
  --es-gold: #d29922;
  --es-gold-dark: #6b4f1a;
  --res-fire: #da3633;
  --res-cold: #58a6ff;
  --res-lightning: #d29922;
  --res-chaos: #a371f7;
  --rarity-normal: #c8c8c8;
  --rarity-magic: #6699cc;
  --rarity-rare: #ffff00;
  --rarity-unique: #ff8c00;
  --damage-phys: #c8c8c8;
  --damage-fire: #da3633;
  --damage-cold: #58a6ff;
  --damage-lightning: #d29922;
  --damage-chaos: #a371f7;
  --gem-red: #da3633;
  --gem-green: #3fb950;
  --gem-blue: #58a6ff;
}

html, body {
  height: 100%;
  font-family: "Microsoft YaHei", "SimHei", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
}

/* ===== Main Layout ===== */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 1400px;
  margin: 0 auto;
  padding: 8px;
  gap: 8px;
}

/* ===== Header (Status Bar) ===== */
#header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 16px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  flex-shrink: 0;
}

.player-info {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 120px;
}

.player-name {
  font-size: 16px;
  font-weight: bold;
  color: var(--text-primary);
}

.player-level {
  font-size: 12px;
  color: var(--text-secondary);
}

.status-bars {
  display: flex;
  gap: 12px;
  flex: 1;
}

.bar {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1;
}

.bar-label {
  font-size: 14px;
  width: 20px;
  text-align: center;
}

.bar-fill {
  flex: 1;
  height: 16px;
  background: #21262d;
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.bar-fill-life {
  height: 100%;
  background: linear-gradient(180deg, var(--life-red) 0%, var(--life-red-dark) 100%);
  transition: width 0.3s ease;
}

.bar-fill-mana {
  height: 100%;
  background: linear-gradient(180deg, var(--mana-blue) 0%, var(--mana-blue-dark) 100%);
  transition: width 0.3s ease;
}

.bar-fill-es {
  height: 100%;
  background: linear-gradient(180deg, var(--es-gold) 0%, var(--es-gold-dark) 100%);
  transition: width 0.3s ease;
}

.bar-text {
  font-size: 11px;
  color: var(--text-secondary);
  min-width: 70px;
  text-align: right;
}

.resistances {
  display: flex;
  gap: 8px;
  font-size: 12px;
}

.res {
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--bg-secondary);
}

.res.fire { color: var(--res-fire); }
.res.cold { color: var(--res-cold); }
.res.lightning { color: var(--res-lightning); }
.res.chaos { color: var(--res-chaos); }

/* ===== Main Content ===== */
#main {
  display: flex;
  gap: 8px;
  flex: 1;
  min-height: 0;
}

#game-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

#sidebar {
  width: 320px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}

/* ===== Panels ===== */
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
}

.panel-title {
  font-size: 14px;
  font-weight: bold;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

/* ===== Scene Display ===== */
#scene-display {
  flex: 1;
}

.scene-content {
  font-size: 15px;
  line-height: 1.8;
  color: var(--text-primary);
}

.scene-content p {
  margin-bottom: 8px;
}

/* ===== Combat Display ===== */
#combat-display {
  flex: 1;
}

#action-bar {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
  padding: 8px;
  background: var(--bg-secondary);
  border-radius: 4px;
}

.action-slot {
  padding: 4px 12px;
  border-radius: 3px;
  font-size: 12px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
}

.action-slot.active {
  border-color: var(--gem-green);
  box-shadow: 0 0 8px rgba(63, 185, 80, 0.3);
}

.action-slot.enemy {
  border-color: var(--life-red);
}

.enemy-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}

.enemy-name {
  min-width: 120px;
  font-size: 13px;
}

.enemy-hp-bar {
  flex: 1;
  height: 10px;
  background: #21262d;
  border-radius: 3px;
  overflow: hidden;
}

.enemy-hp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--life-red) 0%, #f85149 100%);
  transition: width 0.3s ease;
}

.enemy-hp-text {
  font-size: 11px;
  color: var(--text-secondary);
  min-width: 50px;
  text-align: right;
}

/* ===== Crafting Display ===== */
#crafting-display {
  flex: 1;
}

#crafting-slot {
  display: flex;
  justify-content: center;
  margin: 16px 0;
}

.craft-item-slot {
  width: 200px;
  height: 100px;
  border: 2px dashed var(--border-light);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  font-size: 13px;
}

/* ===== Equipment Panel ===== */
.equipment-panel {
  flex-shrink: 0;
}

.equipment-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}

.equip-slot {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}

.equip-slot:hover {
  border-color: var(--border-light);
  background: var(--bg-hover);
}

.slot-label {
  font-size: 11px;
  color: var(--text-dim);
  min-width: 36px;
}

.slot-content {
  flex: 1;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.slot-content.empty {
  color: var(--text-dim);
}

/* Rarity colors for equipped items */
.slot-content.rarity-normal { color: var(--rarity-normal); }
.slot-content.rarity-magic { color: var(--rarity-magic); }
.slot-content.rarity-rare { color: var(--rarity-rare); }
.slot-content.rarity-unique { color: var(--rarity-unique); }

/* ===== Skills Panel ===== */
.skills-panel {
  flex-shrink: 0;
}

.skill-slots {
  display: flex;
  gap: 6px;
}

.skill-slot {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}

.skill-slot:hover {
  border-color: var(--mana-blue);
}

.skill-key {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 11px;
  font-weight: bold;
  color: var(--text-secondary);
}

.skill-content {
  flex: 1;
  font-size: 12px;
  text-align: center;
}

.skill-content.empty {
  color: var(--text-dim);
}

/* ===== Inventory Panel ===== */
.inventory-panel {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.tabs {
  display: flex;
  gap: 2px;
  margin-bottom: 8px;
}

.tab {
  flex: 1;
  padding: 6px 8px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 4px 4px 0 0;
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.tab.active {
  background: var(--bg-hover);
  border-bottom-color: var(--bg-hover);
  color: var(--text-primary);
}

.tab:hover {
  color: var(--text-primary);
}

.inventory-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 0 0 4px 4px;
  min-height: 80px;
}

.inventory-empty {
  text-align: center;
  color: var(--text-dim);
  padding: 20px;
  font-size: 13px;
}

/* ===== Footer (Action Bar) ===== */
#footer {
  flex-shrink: 0;
  padding: 8px 12px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
}

#action-buttons {
  display: flex;
  gap: 6px;
}

.action-btn {
  padding: 6px 14px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-primary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.action-btn:hover {
  background: var(--bg-hover);
  border-color: var(--mana-blue);
}

.action-btn:active {
  transform: scale(0.97);
}

/* ===== Log Panel ===== */
#log-panel {
  max-height: 100px;
  flex-shrink: 0;
}

#log-content {
  max-height: 80px;
  overflow-y: auto;
  font-size: 12px;
}

.log-entry {
  padding: 2px 0;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border);
}

.log-entry:last-child {
  border-bottom: none;
}

/* Scrollbar styling */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: var(--bg-secondary);
}

::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--border-light);
}

</style>
</head>
<body>
  <div id="app">
    <!-- 顶部状态栏 -->
    <header id="header">
      <div class="player-info">
        <span class="player-name">角色名</span>
        <span class="player-level">Lv.1</span>
      </div>
      <div class="status-bars">
        <div class="bar life-bar">
          <span class="bar-label">❤️</span>
          <div class="bar-fill">
            <div class="bar-fill-life" style="width: 85%"></div>
          </div>
          <span class="bar-text">850 / 1000</span>
        </div>
        <div class="bar mana-bar">
          <span class="bar-label">🔮</span>
          <div class="bar-fill">
            <div class="bar-fill-mana" style="width: 60%"></div>
          </div>
          <span class="bar-text">120 / 200</span>
        </div>
        <div class="bar es-bar">
          <span class="bar-label">🛡️</span>
          <div class="bar-fill">
            <div class="bar-fill-es" style="width: 40%"></div>
          </div>
          <span class="bar-text">200 / 500</span>
        </div>
      </div>
      <div class="resistances">
        <span class="res fire">🔥+15%</span>
        <span class="res cold">❄️+20%</span>
        <span class="res lightning">⚡+18%</span>
        <span class="res chaos">☠️-5%</span>
      </div>
    </header>

    <!-- 主体区域 -->
    <main id="main">
      <!-- 左侧：游戏主区域 -->
      <section id="game-area">
        <div id="scene-display" class="panel">
          <h2 class="panel-title">荒芜之地 - 枯萎森林</h2>
          <div class="scene-content">
            <p>你站在一片枯萎的森林中，空气中弥漫着腐败的气息。</p>
            <p>前方隐约可见几个移动的身影...</p>
          </div>
        </div>
        
        <div id="combat-display" class="panel" style="display:none;">
          <h2 class="panel-title">⚔️ 战斗</h2>
          <div id="action-bar">
            <div class="action-slot active">🟢 你</div>
            <div class="action-slot enemy">🔴 怪物1</div>
            <div class="action-slot enemy">🔴 怪物2</div>
          </div>
          <div id="enemies">
            <div class="enemy-row">
              <span class="enemy-name">骸骨战士 Lv.5</span>
              <div class="enemy-hp-bar">
                <div class="enemy-hp-fill" style="width:70%"></div>
              </div>
              <span class="enemy-hp-text">70/100</span>
            </div>
          </div>
        </div>

        <div id="crafting-display" class="panel" style="display:none;">
          <h2 class="panel-title">🔨 装备改造</h2>
          <div id="crafting-slot">
            <div class="craft-item-slot">放置装备</div>
          </div>
          <div id="craft-currency"></div>
        </div>
      </section>

      <!-- 右侧：装备与背包 -->
      <aside id="sidebar">
        <!-- 装备栏 -->
        <div class="panel equipment-panel">
          <h3 class="panel-title">装备</h3>
          <div class="equipment-grid">
            <div class="equip-slot" data-slot="helmet">
              <span class="slot-label">头</span>
              <div class="slot-content empty">-</div>
            </div>
            <div class="equip-slot" data-slot="amulet">
              <span class="slot-label">项链</span>
              <div class="slot-content empty">-</div>
            </div>
            <div class="equip-slot" data-slot="body">
              <span class="slot-label">胸</span>
              <div class="slot-content empty">-</div>
            </div>
            <div class="equip-slot" data-slot="ring1">
              <span class="slot-label">戒指1</span>
              <div class="slot-content empty">-</div>
            </div>
            <div class="equip-slot" data-slot="gloves">
              <span class="slot-label">手</span>
              <div class="slot-content empty">-</div>
            </div>
            <div class="equip-slot" data-slot="ring2">
              <span class="slot-label">戒指2</span>
              <div class="slot-content empty">-</div>
            </div>
            <div class="equip-slot" data-slot="belt">
              <span class="slot-label">腰</span>
              <div class="slot-content empty">-</div>
            </div>
            <div class="equip-slot" data-slot="boots">
              <span class="slot-label">脚</span>
              <div class="slot-content empty">-</div>
            </div>
            <div class="equip-slot" data-slot="offhand">
              <span class="slot-label">副手</span>
              <div class="slot-content empty">-</div>
            </div>
            <div class="equip-slot" data-slot="weapon">
              <span class="slot-label">武器</span>
              <div class="slot-content empty">-</div>
            </div>
          </div>
        </div>

        <!-- 技能组 -->
        <div class="panel skills-panel">
          <h3 class="panel-title">技能</h3>
          <div class="skill-slots">
            <div class="skill-slot" data-key="1">
              <span class="skill-key">1</span>
              <div class="skill-content empty">-</div>
            </div>
            <div class="skill-slot" data-key="2">
              <span class="skill-key">2</span>
              <div class="skill-content empty">-</div>
            </div>
            <div class="skill-slot" data-key="3">
              <span class="skill-key">3</span>
              <div class="skill-content empty">-</div>
            </div>
          </div>
        </div>

        <!-- 背包 -->
        <div class="panel inventory-panel">
          <h3 class="panel-title">背包</h3>
          <div id="inventory-tabs" class="tabs">
            <button class="tab active" data-tab="items">装备</button>
            <button class="tab" data-tab="currency">通货</button>
            <button class="tab" data-tab="gems">宝石</button>
          </div>
          <div id="inventory-content" class="inventory-list">
            <div class="inventory-empty">暂无物品</div>
          </div>
        </div>
      </aside>
    </main>

    <!-- 底部操作栏 -->
    <footer id="footer">
      <div id="action-buttons">
        <button class="action-btn">1: 裂风斩</button>
        <button class="action-btn">2: 闪电箭</button>
        <button class="action-btn">3: 闪避</button>
        <button class="action-btn">Q: 查看</button>
        <button class="action-btn">W: 天赋</button>
        <button class="action-btn">E: 药剂</button>
      </div>
    </footer>

    <!-- 日志区域 -->
    <div id="log-panel" class="panel">
      <div id="log-content">
        <div class="log-entry">欢迎来到PoE文字游戏</div>
      </div>
    </div>
  </div>
